name: Run Channel 2 Agent

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-agent-foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Validate example story profile
        run: python -m channel2.main

  packaging-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install wheel in a clean environment
        run: |
          python -m venv "${RUNNER_TEMP}/channel2-smoke"
          "${RUNNER_TEMP}/channel2-smoke/bin/pip" install dist/*.whl

      - name: Run CLI from outside the repository
        run: |
          mkdir -p "${RUNNER_TEMP}/outside"
          cp tests/fixtures/valid_story.json "${RUNNER_TEMP}/outside/"
          cd "${RUNNER_TEMP}/outside"
          "${RUNNER_TEMP}/channel2-smoke/bin/channel2" --input valid_story.json
