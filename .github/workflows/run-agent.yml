name: Run Channel 2 Agent

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-agent-foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest

      - name: Validate example story profile
        run: python -m channel2.main