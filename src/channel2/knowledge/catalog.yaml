version: 2

# Structured extracts only. The markdown files remain the source of truth.
# Every entry must cite the section that defines it; knowledge.loader enforces
# that these collections stay identical to the enums in models/vocabulary.py.
content_pillars:
  - id: human-stories
    name: Human Stories
    description: Human behavior, relationships, friendship, family, and social situations.
    source: content-pillars.md#1-human-stories
  - id: unbelievable-survival
    name: Unbelievable / Survival
    description: Verified survival, danger, animal encounters, and unusual real-world events.
    source: content-pillars.md#2-unbelievable--survival
  - id: funny-relatable
    name: Funny & Relatable
    description: Recognizable everyday situations that create humor and shared experience.
    source: content-pillars.md#3-funny--relatable
  - id: mystery-strange
    name: Mystery / Strange
    description: Verified mysteries, unusual facts, discoveries, and strange events.
    source: content-pillars.md#4-mystery--strange
  - id: satisfying-emotional
    name: Satisfying / Emotional
    description: Transformations and stories creating relief, warmth, or satisfaction.
    source: content-pillars.md#5-satisfying--emotional

hook_types:
  - id: curiosity
    name: Curiosity
    description: Creates an information gap the story resolves.
    source: hook-system.md#a-curiosity-hook
  - id: unexpected-outcome
    name: Unexpected Outcome
    description: Establishes an expected result and then creates uncertainty.
    source: hook-system.md#b-unexpected-outcome-hook
  - id: question
    name: Question
    description: Opens with a direct question answered by the story.
    source: hook-system.md#c-question-hook
  - id: immediate-action
    name: Immediate Action
    description: Begins at the most interesting action before supplying context.
    source: hook-system.md#d-immediate-action-hook
  - id: emotional
    name: Emotional
    description: Immediately establishes a restrained emotional situation.
    source: hook-system.md#e-emotional-hook
  - id: relatable
    name: Relatable
    description: Creates honest recognition through a familiar situation.
    source: hook-system.md#f-relatable-hook
  - id: danger-survival
    name: Danger / Survival
    description: Establishes verified risk or danger immediately.
    source: hook-system.md#g-danger--survival-hook
  - id: transformation
    name: Transformation
    description: Creates anticipation around a visible before-and-after change.
    source: hook-system.md#h-transformation-hook
  - id: contradiction
    name: Contradiction
    description: Pairs apparently incompatible ideas to create curiosity.
    source: hook-system.md#i-contradiction-hook
  - id: quiet-curiosity
    name: Quiet Curiosity
    description: Uses subtle visual or narrative curiosity without high intensity.
    source: hook-system.md#j-quiet-curiosity-hook

story_modes:
  - id: twist
    name: Twist Story
    description: Hook, context, escalation, and an earned twist.
    source: story-engine.md#mode-a--twist-story
  - id: survival
    name: Survival Story
    description: Hook, danger, escalation, and verified survival or relief.
    source: story-engine.md#mode-b--survival-story
  - id: emotional
    name: Emotional Story
    description: Hook, situation, emotional development, and payoff.
    source: story-engine.md#mode-c--emotional-story
  - id: funny
    name: Funny Story
    description: Hook, relatable situation, escalation, and comedic payoff.
    source: story-engine.md#mode-d--funny-story
  - id: mystery-discovery
    name: Mystery / Discovery
    description: Hook, question, evidence or clues, and a supported reveal.
    source: story-engine.md#mode-e--mystery--discovery
  - id: transformation
    name: Transformation
    description: Before, process, escalation, and visible transformation.
    source: story-engine.md#mode-f--transformation
  - id: calm-relief
    name: Calm / Relief
    description: Curiosity or tension develops toward relief or peace.
    source: story-engine.md#mode-g--calm--relief

# Narrative skeleton, independent of the emotional register in story_modes.
story_structures:
  - id: hook-story-twist
    name: Hook -> Story -> Twist
    description: Opens, tells the situation, then reverses the expected meaning.
    source: README.md#6-storytelling
  - id: hook-escalation-payoff
    name: Hook -> Escalation -> Payoff
    description: Opens and raises stakes continuously toward a direct reward.
    source: README.md#6-storytelling
  - id: question-investigation-answer
    name: Question -> Investigation -> Answer
    description: Poses a question, gathers evidence, then answers it.
    source: README.md#6-storytelling
  - id: situation-conflict-resolution
    name: Situation -> Conflict -> Resolution
    description: Establishes a situation, introduces conflict, then resolves it.
    source: README.md#6-storytelling
  - id: curiosity-discovery-reveal
    name: Curiosity -> Discovery -> Reveal
    description: Builds an information gap, discovers clues, then reveals.
    source: README.md#6-storytelling
  - id: setup-event-reaction
    name: Setup -> Unexpected Event -> Reaction
    description: Establishes normality, breaks it, then shows the response.
    source: README.md#6-storytelling
  - id: problem-transformation-satisfaction
    name: Problem -> Transformation -> Satisfaction
    description: Shows a problem, the change process, then the satisfying result.
    source: README.md#6-storytelling
  - id: calm-tension-relief
    name: Calm -> Tension -> Relief
    description: Starts calm, introduces tension, then releases it.
    source: README.md#6-storytelling

visual_formats:
  - id: roblox
    name: Roblox
    description: Story staged and captured inside Roblox.
    source: README.md#4-visual-philosophy
  - id: real-footage
    name: Real Footage
    description: Authentic real-world video of the subject or situation.
    source: README.md#4-visual-philosophy
  - id: cinematic
    name: Cinematic
    description: Deliberately composed and graded footage with filmic treatment.
    source: README.md#4-visual-philosophy
  - id: ai-generated
    name: AI Generated
    description: Model-generated imagery, used only when it serves the story.
    source: README.md#4-visual-philosophy
  - id: animation
    name: Animation
    description: Illustrated or motion-graphic sequences.
    source: README.md#4-visual-philosophy
  - id: gameplay
    name: Gameplay
    description: Captured play from a game other than Roblox.
    source: README.md#4-visual-philosophy
  - id: nature
    name: Nature
    description: Environmental and landscape imagery.
    source: README.md#4-visual-philosophy
  - id: animal
    name: Animal
    description: Animal-focused footage.
    source: README.md#4-visual-philosophy

# Shared by narration pacing and visual cut rhythm.
tempos:
  - id: slow
    name: Slow
    description: Deliberate rate that gives each beat room to register.
    source: voice-narration-system.md#5-narration-pacing
  - id: moderate
    name: Moderate
    description: Conversational rate suited to most storytelling.
    source: voice-narration-system.md#5-narration-pacing
  - id: fast
    name: Fast
    description: High-energy rate that compresses time between beats.
    source: voice-narration-system.md#5-narration-pacing
  - id: variable
    name: Variable
    description: Rate deliberately changes within a single video.
    source: voice-narration-system.md#8-voice-variation

emotional_targets:
  - id: amusement
    name: Amusement
    description: Intended reaction is laughter or entertainment.
    source: analytics-experimentation-system.md#8-emotional-response-analysis
  - id: shock
    name: Shock
    description: Intended reaction is disbelief at an extreme outcome.
    source: analytics-experimentation-system.md#8-emotional-response-analysis
  - id: emotion
    name: Emotion
    description: Intended reaction is being moved or touched.
    source: analytics-experimentation-system.md#8-emotional-response-analysis
  - id: curiosity
    name: Curiosity
    description: Intended reaction is needing an unanswered question resolved.
    source: analytics-experimentation-system.md#8-emotional-response-analysis
  - id: surprise
    name: Surprise
    description: Intended reaction is an unexpected turn.
    source: analytics-experimentation-system.md#8-emotional-response-analysis
  - id: relief
    name: Relief
    description: Intended reaction is release after tension.
    source: analytics-experimentation-system.md#8-emotional-response-analysis
  - id: gratitude
    name: Gratitude
    description: Intended reaction is thankfulness or perspective.
    source: analytics-experimentation-system.md#8-emotional-response-analysis
  - id: warmth
    name: Warmth
    description: Intended reaction is tenderness or affection.
    source: analytics-experimentation-system.md#8-emotional-response-analysis
  - id: satisfaction
    name: Satisfaction
    description: Intended reaction is completion or resolution.
    source: analytics-experimentation-system.md#8-emotional-response-analysis

decisions:
  - id: push
    name: Push
    description: Evidence supports increasing testing and production.
    source: analytics-experimentation-system.md#17-push--pull-decisions
  - id: maintain
    name: Maintain
    description: Keep producing while collecting more evidence.
    source: analytics-experimentation-system.md#17-push--pull-decisions
  - id: pull
    name: Pull
    description: Repeated testing suggests reducing or pausing the format.
    source: analytics-experimentation-system.md#17-push--pull-decisions
  - id: rework
    name: Rework
    description: Keep the concept but change one specific weak element.
    source: analytics-experimentation-system.md#17-push--pull-decisions
  - id: no-decision
    name: No Decision
    description: Sample is too small to justify any decision yet.
    source: analytics-experimentation-system.md#16-sample-size
